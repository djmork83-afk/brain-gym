<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BrainGym</title>
  <meta name="description" content="Free brain training games: memory, attention, mental math. No ads." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/games/schulte.css" />
  <link rel="stylesheet" href="css/games/simon.css" />
  <link rel="stylesheet" href="css/games/numbers.css" />
  <link rel="stylesheet" href="css/games/parking.css" />
  <link rel="stylesheet" href="css/games/stopsignal.css" />
  <link rel="stylesheet" href="css/games/shopping.css" />
  <link rel="stylesheet" href="css/games/constellations.css" />
</head>
<body>
  <header class="top">
    <a class="logo" href="#/">🧠 <span>BrainGym</span></a>
    <nav class="nav">
      <a href="#/" data-i18n="nav.games">Games</a>
      <a href="#/profile" data-i18n="nav.profile">Progress</a>
    </nav>
    <div class="hstats">
      <span class="badge" id="badge-level">Lv 1</span>
      <span class="badge" id="badge-streak">🔥 0</span>
    </div>
    <select id="lang-select" aria-label="Language"></select>
  </header>

  <main id="view" class="view"></main>

  <footer class="foot">
    <span data-i18n="footer.line">Free, no ads. Made to help people grow.</span>
  </footer>

  <div id="toast-host" class="toast-host" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
